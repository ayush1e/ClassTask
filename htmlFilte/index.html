<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="./style.js"></script>

</head>
<body>
  <h1 onclick="getdata()">hhh</h1>
  <script>
    function getdata() {
     
       getdata = fetch('https://jsonplaceholder.typicode.com/posts').then( 
  (response) => response.json() );
    getdata.then((data) => {
        console.log(data);
        let output = '';
        data.forEach(post => {
          output += `<h2>  ${post.title}</h2><p>${post.body}</p>`;
        });
        document.body.innerHTML += output;
      }).catch((error) => {
        console.error('Error fetching data:', error);
      });
    }
  </script>

</body>
</html>
